name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check and Android bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect mobile application
        id: app
        shell: bash
        run: |
          if [[ -f mobile/package.json && -f mobile/package-lock.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No mobile app or npm lockfile exists in this branch; mobile checks are skipped."
          fi

      - name: Set up Node.js
        if: steps.app.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.app.outputs.available == 'true'
        working-directory: mobile
        run: npm ci

      - name: Run TypeScript checks
        if: steps.app.outputs.available == 'true'
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Export Android bundle
        if: steps.app.outputs.available == 'true'
        working-directory: mobile
        run: npx expo export --platform android
